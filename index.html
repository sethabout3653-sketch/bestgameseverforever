<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <!-- Strict Anti-Indexing & Anti-Archiving Directives -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, unavailable_after: 1-Jan-2000">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">

  <!-- Force No-Cache across Edge/Proxy Nodes -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, s-maxage=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    /* Complete DOM isolation and reset */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background-color: #000 !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <!-- Main Loader Script -->
  <script src="app.js"></script>
</body>
</html>
